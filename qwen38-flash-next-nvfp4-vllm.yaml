# Qwen3.8-Flash-Next NVFP4 on 2x DGX Spark (GB10) under vLLM -- Kubernetes manifest
#
# Sanitised for publication:
#   /home/HEAD_USER, /home/WORKER_USER  -> your local users (hostPath mounts)
#   10.0.0.1 / 10.0.0.2                 -> the two ends of YOUR inter-node RDMA link
#   example.com                         -> your annotation domain
#   nvidia-dgx / gx10-ec3d              -> your two node names
#
# Read the README first. The single most important line here is `--headless`
# on the rank != 0 launch; without it the head hangs for 34 minutes with no log.
# =============================================================================
# Qwen3.8-Flash-Next NVFP4 en vLLM TP=2 sobre 2x DGX Spark (GB10 / SM121).
#
# MIGRACION DESDE SGLANG (01-09-2026). El manifiesto de SGLang se CONSERVA en
# k8s/qwen38-flash-next-nvfp4-sglang.yaml a proposito: el rollback es un repin
# al SHA anterior, no un revert de ficheros.
#
# Motivo del cambio: el bucle de token 0 ("!!!!!") de sglang#36537. En SGLang
# se reprodujo de forma fiable con carga agentica; la ruta de vLLM no lo
# reproduce porque su MambaManager (mamba_cache_mode=align) corrige el estado
# DESPUES de conocer cuantos tokens especulativos se aceptaron, en vez de
# cachear los estados SSM intermedios durante el verify.
#
# La receta es la de un despliegue hermano ya rodado en 2x DGX Spark, traducida
# de Sparkrun a k8s. Origen: MANIFEST.md del bundle
# qwen38-vllm-bf16-mem80-seqs10-20260831, vLLM 0.1.dev20073+g8e685d198,
# imagen vllm/vllm-openai:qwen38-flash-next.
#
# COSTE CONOCIDO, medido por el autor de la receta (llama-benchy, 28/28 celdas):
#   depth 0   / c1   generacion 36,3 tok/s   TTFR 832 ms
#   depth 0   / c10  generacion 91,5 tok/s   TTFR 6698 ms
#   depth 100K/ c2   generacion 45,3 tok/s
# Nuestro SGLang daba 41-44 tok/s a c1, asi que se pierde ~15% de flujo unico.
# Se acepta a cambio de no reproducir la corrupcion.
#
# KV EN BF16, NO fp8. La QSA de esta imagen RECHAZA fp8_e4m3 como KV principal
# ("Do not replace `auto` with `fp8_e4m3` without a newer compatible QSA
# kernel"). Existe parche en vllm#54426 medido en GB10 (pool x1.79, decode
# plano); se aplicara despues, en cambio separado.
#
# PARCHE PLE: la imagen necesita vllm_ple_layer.py encima de su ple_layer.py
# para cargar los shards PLE en FP8. En Sparkrun es un bind-mount; aqui va como
# ConfigMap montado sobre el fichero (subPath), que es el equivalente k8s.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: qwen38-flash-next-vllm-ple
  namespace: llm
  labels:
    llm.dgx-infra/model-family: qwen38-next
data:
  ple_layer.py: |
